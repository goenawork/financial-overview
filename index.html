<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Overview Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- Memuat Chart.js untuk grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="header-container">
    <h1 class="main-title">FINANCIAL OVERVIEW DASHBOARD</h1>
    <div class="filter-group">
      <div class="filter-item">
        <label>YEAR</label>
        <span>2026</span>
      </div>
      <div class="filter-item">
        <label>MONTH</label>
       <select id="month-selector">
  <option value="JANUARI">JANUARI</option>
  <option value="FEBRUARI">FEBRUARI</option>
  <option value="MARET">MARET</option>
  <option value="APRIL">APRIL</option>
  <option value="MEI">MEI</option>
  <option value="JUNI">JUNI</option>
  <option value="JULI">JULI</option>
  <option value="AGUSTUS">AGUSTUS</option>
  <option value="SEPTEMBER">SEPTEMBER</option>
  <option value="OKTOBER" selected>OKTOBER</option>
  <option value="NOVEMBER">NOVEMBER</option>
  <option value="DESEMBER">DESEMBER</option>
</select>
      </div>
    </div>
  </div>

  <!-- Ringkasan Angka -->
  <div class="summary-cards">
    <div class="card expenses-card">
      <div class="card-header">TOTAL EXPENSES</div>
      <div class="card-value" id="total-expenses">Rp0</div>
    </div>
    <div class="right-cards">
      <div class="card small-card">
        <div class="card-header">THIS MONTH'S BUDGET</div>
        <div class="card-value" id="month-budget">Rp0</div>
      </div>
      <div class="card small-card">
        <div class="card-header">RECENT BUDGET</div>
        <div class="card-value" id="recent-budget">Rp0</div>
      </div>
    </div>
  </div>

  <div class="progress-bar-container">
    <div class="progress-bar" id="budget-progress" style="width: 0%;"></div>
    <span class="progress-text" id="progress-percentage">0%</span>
  </div>

  <!-- Grafik -->
  <div class="charts-container">
    <div class="chart-box">
      <canvas id="donutChart"></canvas>
    </div>
    <div class="chart-box">
      <h3>TOTAL PENGELUARAN vs TANGGAL</h3>
      <canvas id="lineChart"></canvas>
    </div>
  </div>

  <!-- Tabel Ringkasan Kategori -->
  <div class="table-container">
    <h3 class="table-title">TRANSACTION SUMMARY BY CATEGORY</h3>
    <table id="category-table">
      <thead>
        <tr>
          <th>CATEGORY</th>
          <th>EXPENSES</th>
          <th>BUDGET</th>
          <th>SALDO</th>
          <th>PERSENTASE</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data akan dimuat melalui JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- Tabel Pengeluaran per Tanggal -->
  <div class="table-container half-width">
    <h3 class="table-title">EXPENSES BY DATE</h3>
    <table id="date-table">
      <thead>
        <tr>
          <th>DATE</th>
          <th>TOTAL</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data akan dimuat melalui JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- Form Input (Tetap dipertahankan di bagian bawah) -->
  <div class="card form-card">
    <h3>Input New Transaction</h3>
    <form id="transaction-form">
      <input type="date" id="date" required>
      <input type="text" id="needs" placeholder="Needs (e.g., JAJAN, BBM)" required>
      <input type="number" id="amount" placeholder="Amount (e.g., 25000)" required>
      <input type="text" id="description" placeholder="Description (e.g., Batagor)" required>
      <select id="category">
        <option value="EXPENSES">EXPENSES</option>
        <option value="SAVING">SAVING</option>
      </select>
      <button type="submit" id="btn-submit">Save Transaction</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
