<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Financial Record</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>💸 Financial Dashboard</h2>

  <div class="card">
    <h3>Input New Transaction</h3>
    <form id="transaction-form">
      <input type="date" id="date" required>
      <input type="text" id="description" placeholder="Description (e.g., Lunch)" required>
      <input type="number" id="amount" placeholder="Amount (e.g., 25000)" required>
      <select id="type">
        <option value="Expense">Expense</option>
        <option value="Income">Income</option>
      </select>
      <button type="submit" id="btn-submit">Save Transaction</button>
    </form>
  </div>

  <div class="card">
    <h3>Dashboard Summary</h3>
    <button type="button" id="btn-load" class="btn-success">🔄 Load Google Sheets Data</button>
    <div id="dashboard-result"><i>No data loaded yet.</i></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
