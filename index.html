<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Financial Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Header Area -->
    <header class="header">
      <div class="header-titles">
        <h1>FINANCIAL OVERVIEW DASHBOARD</h1>
        <p class="subtitle">Aang Gunawan</p>
      </div>
      <div class="header-filters">
        <div class="filter-group">
          <label>Tahun</label>
          <select id="year-selector">
            <option value="2026">2026</option>
            <option value="2027">2027</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Bulan</label>
          <select id="month-selector">
            <option value="JANUARI">JANUARI</option>
            <option value="FEBRUARI">FEBRUARI</option>
            <option value="MARET">MARET</option>
            <option value="APRIL">APRIL</option>
            <option value="MEI">MEI</option>
            <option value="JUNI">JUNI</option>
            <option value="JULI">JULI</option>
            <option value="AGUSTUS">AGUSTUS</option>
            <option value="SEPTEMBER">SEPTEMBER</option>
            <option value="OKTOBER" selected>OKTOBER</option>
            <option value="NOVEMBER">NOVEMBER</option>
            <option value="DESEMBER">DESEMBER</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Top Stats -->
    <section class="top-stats">
      <div class="stat-card primary-card">
        <h3>Total Expenses</h3>
        <h2 id="total-expenses">Rp0</h2>
      </div>
      <div class="stat-card">
        <h3>This Month's Budget</h3>
        <h2 id="month-budget" class="text-dark">Rp0</h2>
      </div>
      <div class="stat-card">
        <div class="budget-header">
          <h3>Recent Budget</h3>
          <span id="progress-percentage" class="text-primary">0%</span>
        </div>
        <h2 id="recent-budget" class="text-dark">Rp0</h2>
        <div class="progress-track">
          <div class="progress-fill" id="budget-progress" style="width: 0%;"></div>
        </div>
      </div>
    </section>

    <!-- Charts Area -->
    <section class="charts-section">
      <div class="chart-card">
        <h3>Expenses by Category</h3>
        <div class="canvas-container donut-container">
          <canvas id="donutChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Total Pengeluaran vs Tanggal</h3>
        <div class="canvas-container line-container">
          <canvas id="lineChart"></canvas>
        </div>
      </div>
    </section>

    <!-- Tables Area -->
    <section class="tables-section">
      <div class="table-card">
        <h3>Transaction Summary by Category</h3>
        <div class="table-responsive">
          <table id="category-table">
            <thead>
              <tr>
                <th>CATEGORY</th>
                <th>EXPENSES</th>
                <th>BUDGET</th>
                <th>SALDO</th>
                <th>PERSENTASE</th>
              </tr>
            </thead>
            <tbody>
              <!-- Data dimuat via JS -->
            </tbody>
          </table>
        </div>
      </div>
      <div class="table-card">
        <h3>Expenses by Date</h3>
        <div class="table-responsive">
          <table id="date-table">
            <thead>
              <tr>
                <th>DATE</th>
                <th>TOTAL</th>
              </tr>
            </thead>
            <tbody>
              <!-- Data dimuat via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Input Form -->
    <section class="form-section">
      <h3>Input New Transaction</h3>
      <form id="transaction-form" class="transaction-form">
        <div class="form-grid">
          <div class="input-group">
            <label>Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="input-group">
            <label>Needs</label>
            <select id="needs" required>
              <option value="" disabled selected>Pilih Kategori...</option>
              <option value="BBM">BBM</option>
              <option value="JAJAN">JAJAN</option>
              <option value="MAKAN">MAKAN</option>
              <option value="MONTHLY NEED">MONTHLY NEED</option>
              <option value="KUOTA">KUOTA</option>
              <option value="KEPERLUAN">KEPERLUAN</option>
              <option value="LAINNYA">LAINNYA</option>
            </select>
          </div>
          <div class="input-group">
            <label>Amount</label>
            <input type="number" id="amount" placeholder="Cth: 50000" required>
          </div>
          <div class="input-group">
            <label>Description</label>
            <input type="text" id="description" placeholder="Cth: Makan Siang" required>
          </div>
          <div class="input-group">
            <label>Category</label>
            <select id="category" required>
              <option value="EXPENSES">EXPENSES</option>
              <option value="SAVING">SAVING</option>
            </select>
          </div>
        </div>
        <button type="submit" id="btn-submit" class="btn-submit">Save Transaction</button>
      </form>
    </section>

  </div>
  <script src="script.js"></script>
</body>
</html>
